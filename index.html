<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="color-scheme" content="light" />
    <meta name="google" content="notranslate" />
    <title>Work Platform</title>
    <script>
      (function () {
        try {
          var keys = Object.keys(localStorage);
          for (var i = 0; i < keys.length; i++) {
            if (keys[i].indexOf('cached_company_name:') === 0) {
              var v = localStorage.getItem(keys[i]);
              if (v && /quantum\s*trader/i.test(v)) {
                localStorage.removeItem(keys[i]);
              }
            }
          }
          var name = localStorage.getItem('cached_company_name:global');
          if (!name) {
            keys = Object.keys(localStorage);
            for (var j = 0; j < keys.length; j++) {
              if (keys[j].indexOf('cached_company_name:') === 0) {
                var v2 = localStorage.getItem(keys[j]);
                if (v2) { name = v2; break; }
              }
            }
          }
          if (name) document.title = 'Work Platform';
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical CSS - Prevent FOUC */
      html {
        background-color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #ffffff;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        position: relative;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #root.ready {
        opacity: 1;
        transform: translateY(0);
      }

      @media (min-width: 768px) and (max-width: 1366px) and (hover: none) {
        html { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { overscroll-behavior: none; }
      }

      /* Loading Screen */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(160deg, #f8fafc 0%, #eff6ff 40%, #dbeafe 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        user-select: none;
        -webkit-user-select: none;
        opacity: 1;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loader-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        animation: loaderEnter 0.5s ease-out;
      }

      /* Outer spinning ring */
      .loader-spinner {
        position: relative;
        width: 72px;
        height: 72px;
      }
      .loader-spinner .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
      }
      .loader-spinner .ring-1 {
        border-top-color: #2563eb;
        border-right-color: #2563eb;
        animation: spinRing 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .loader-spinner .ring-2 {
        inset: 8px;
        border-bottom-color: #60a5fa;
        border-left-color: #60a5fa;
        animation: spinRing 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite reverse;
      }
      .loader-spinner .ring-3 {
        inset: 16px;
        border-top-color: #93c5fd;
        animation: spinRing 2s linear infinite;
      }
      .loader-spinner .center-dot {
        position: absolute;
        top: 50%; left: 50%;
        width: 10px; height: 10px;
        margin: -5px 0 0 -5px;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        border-radius: 50%;
        animation: dotPulse 1.5s ease-in-out infinite;
        box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
      }

      /* Progress bar */
      .loader-progress {
        width: 160px;
        height: 3px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 3px;
        overflow: hidden;
      }
      .loader-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2563eb, #60a5fa);
        border-radius: 3px;
        animation: progressGrow 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      .loader-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        font-weight: 500;
        color: #64748b;
        letter-spacing: 0.3px;
      }

      @keyframes spinRing {
        to { transform: rotate(360deg); }
      }
      @keyframes dotPulse {
        0%, 100% { transform: scale(0.85); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes progressGrow {
        0% { width: 0%; }
        20% { width: 15%; }
        50% { width: 45%; }
        80% { width: 75%; }
        100% { width: 90%; }
      }
      @keyframes loaderEnter {
        from { opacity: 0; transform: scale(0.95) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
    </style>
    <meta name="twitter:card" content="summary_large_image">
</head>
  <body class="notranslate" translate="no">
    <div id="loading-screen">
      <div class="loader-wrapper">
        <div class="loader-spinner">
          <div class="ring ring-1"></div>
          <div class="ring ring-2"></div>
          <div class="ring ring-3"></div>
          <div class="center-dot"></div>
        </div>
        <div class="loader-progress"><div class="loader-progress-bar"></div></div>
        <div class="loader-label">Loading...</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var ls = document.getElementById('loading-screen');
        var root = document.getElementById('root');
        var bar = ls && ls.querySelector('.loader-progress-bar');
        var dismissed = false;

        function dismissLoader() {
          if (dismissed) return;
          dismissed = true;
          // Complete the progress bar first
          if (bar) { bar.style.transition = 'width 0.3s ease-out'; bar.style.width = '100%'; }
          // Short pause to show 100%, then transition
          setTimeout(function() {
            if (ls) ls.classList.add('fade-out');
            // Reveal content with a slight delay so fade-out is visible
            setTimeout(function() {
              if (root) root.classList.add('ready');
            }, 150);
            setTimeout(function() {
              if (ls && ls.parentNode) ls.parentNode.removeChild(ls);
            }, 700);
          }, 200);
        }

        window.__dismissLoader = dismissLoader;
        // Safety fallback
        setTimeout(dismissLoader, 5000);
      })();
    </script>
  </body>
</html>
