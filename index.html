<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="color-scheme" content="light" />
    <meta name="google" content="notranslate" />
    <title>Work Platform</title>
    <script>
      (function () {
        try {
          var keys = Object.keys(localStorage);
          for (var i = 0; i < keys.length; i++) {
            if (keys[i].indexOf('cached_company_name:') === 0) {
              var v = localStorage.getItem(keys[i]);
              if (v && /quantum\s*trader/i.test(v)) {
                localStorage.removeItem(keys[i]);
              }
            }
          }
          var name = localStorage.getItem('cached_company_name:global');
          if (!name) {
            keys = Object.keys(localStorage);
            for (var j = 0; j < keys.length; j++) {
              if (keys[j].indexOf('cached_company_name:') === 0) {
                var v2 = localStorage.getItem(keys[j]);
                if (v2) { name = v2; break; }
              }
            }
          }
          if (name) document.title = 'Work Platform';
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical CSS - Prevent FOUC */
      html {
        background-color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #ffffff;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        position: relative;
        opacity: 0;
      }
      #root.ready {
        opacity: 1;
      }

      /* Same phone root sizes as src/index.css, so the boot loader's rem sizes already match before the stylesheet loads. */
      @media (max-width: 320px) { html { font-size: 12px; } }
      @media (min-width: 321px) and (max-width: 375px) { html { font-size: 13px; } }
      @media (min-width: 376px) and (max-width: 414px) { html { font-size: 14px; } }
      @media (min-width: 415px) and (max-width: 480px) { html { font-size: 15px; } }

      @media (min-width: 768px) and (max-width: 1366px) and (hover: none) {
        html { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { overscroll-behavior: none; }
      }

      /* Boot loader: static replica of src/components/employee/PageLoader.tsx so reload / reconnect looks like page switching.
         Animation phases come from performance.now() (set in the inline script below), the same clock PageLoader uses. */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        user-select: none;
        -webkit-user-select: none;
        opacity: 1;
        transition: opacity 0.25s ease-out;
      }
      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .boot-loader {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
      }
      .boot-stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 10rem;
        height: 10rem;
      }
      .boot-glow {
        position: absolute;
        width: 75%;
        height: 75%;
        border-radius: 9999px;
        background: linear-gradient(to bottom right, #dbeafe, #cffafe);
        opacity: 0.7;
        filter: blur(40px);
      }
      .boot-block {
        position: absolute;
        border-radius: 8px;
        transform: rotate(var(--emp-rot));
        animation: emp-loader-block 2.6s ease-in-out calc(var(--d) - var(--p5200)) infinite alternate;
      }
      .boot-ring {
        position: relative;
        width: 4rem;
        height: 4rem;
      }
      .boot-ring > div {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 4px solid #dbeafe;
      }
      .boot-ring > .boot-spin {
        border-color: transparent;
        border-top-color: #3b82f6;
        border-right-color: #22d3ee;
        animation: emp-spin 1s linear calc(0ms - var(--p1000)) infinite;
      }
      .boot-ring > .boot-dot-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
      }
      .boot-dot {
        width: 0.625rem;
        height: 0.625rem;
        border-radius: 9999px;
        background: rgba(59, 130, 246, 0.8);
        animation: emp-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) calc(0ms - var(--p2000)) infinite;
      }
      .boot-label {
        margin-top: -1rem;
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.025em;
        color: #64748b;
      }
      @media (min-width: 640px) {
        .boot-stage { width: 12rem; height: 12rem; }
        .boot-ring { width: 72px; height: 72px; }
        .boot-label { font-size: 1rem; line-height: 1.5rem; }
      }
      @keyframes emp-loader-block {
        from { opacity: 0.55; transform: translateY(0) rotate(var(--emp-rot)); }
        to { opacity: 1; transform: translateY(-8px) rotate(var(--emp-rot)); }
      }
      @keyframes emp-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes emp-pulse {
        50% { opacity: 0.5; }
      }
    </style>
    <meta name="twitter:card" content="summary_large_image">
</head>
  <body class="notranslate" translate="no">
    <div id="loading-screen" role="status" aria-live="polite">
      <div class="boot-loader">
        <div class="boot-stage">
          <div class="boot-glow"></div>
          <div class="boot-block" style="--emp-rot:-14deg;--d:0ms;width:34px;height:34px;left:calc(50% - 145px);top:calc(50% - 95px);background:rgba(191,219,254,.6)"></div>
          <div class="boot-block" style="--emp-rot:12deg;--d:400ms;width:26px;height:26px;left:calc(50% + 91px);top:calc(50% - 109px);background:rgba(165,243,252,.7)"></div>
          <div class="boot-block" style="--emp-rot:18deg;--d:800ms;width:38px;height:38px;left:calc(50% + 99px);top:calc(50% + 23px);background:rgba(199,210,254,.5)"></div>
          <div class="boot-block" style="--emp-rot:-8deg;--d:1200ms;width:24px;height:24px;left:calc(50% - 124px);top:calc(50% + 46px);background:rgba(186,230,253,.7)"></div>
          <div class="boot-block" style="--emp-rot:24deg;--d:600ms;width:18px;height:18px;left:calc(50% - 39px);top:calc(50% - 137px);background:rgba(147,197,253,.4)"></div>
          <div class="boot-ring">
            <div></div>
            <div class="boot-spin"></div>
            <div class="boot-dot-wrap"><div class="boot-dot"></div></div>
          </div>
        </div>
        <span class="boot-label" id="boot-label">Loading...</span>
      </div>
    </div>
    <script>
      (function () {
        var ls = document.getElementById('loading-screen');
        var n = performance.now();
        ls.style.setProperty('--p5200', (n % 5200) + 'ms');
        ls.style.setProperty('--p1000', (n % 1000) + 'ms');
        ls.style.setProperty('--p2000', (n % 2000) + 'ms');
        var labels = { en: 'Loading...', es: 'Cargando...', zh: '加载中...', fr: 'Chargement...', de: 'Laden...', pt: 'Carregando...', ja: '読み込み中...', ko: '로딩 중...', it: 'Caricamento...', hi: 'लोड हो रहा है...' };
        try {
          var lang = localStorage.getItem('employee_language');
          if (lang && labels[lang]) document.getElementById('boot-label').textContent = labels[lang];
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var ls = document.getElementById('loading-screen');
        var root = document.getElementById('root');
        var dismissed = false;

        // Root appears at once: the React boot loader underneath is identical to this one, so there is no visible jump.
        function dismissLoader() {
          if (dismissed) return;
          dismissed = true;
          if (root) root.classList.add('ready');
          if (ls) ls.classList.add('fade-out');
          setTimeout(function() {
            if (ls && ls.parentNode) ls.parentNode.removeChild(ls);
          }, 350);
        }

        window.__dismissLoader = dismissLoader;
        // Safety fallback
        setTimeout(dismissLoader, 5000);
      })();
    </script>
  </body>
</html>
